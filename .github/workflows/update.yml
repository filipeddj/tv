name: Atualizar Live SBT

on:
  schedule:
    # Roda a cada 6 horas automaticamente
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite rodar manualmente pelo painel do GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Atualizar e Instalar yt-dlp mais recente
        run: |
          pip install --upgrade pip
          pip install --upgrade yt-dlp

      - name: Rodar script Python
        run: python update_links.py

      - name: Salvar alterações no repositório
        run: |
          git config --global user.name "Bot do GitHub"
          git config --global user.email "bot@users.noreply.github.com"
          git add lista.m3u 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Atualizar link do SBT" && git push)
